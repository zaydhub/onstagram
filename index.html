<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<meta name="theme-color" content="#f8f8fa">

<title>Onstagram</title>


<style>

/* =========================================================
   APPLE / iOS INSPIRED ONSTAGRAM
========================================================= */

:root {

    --background: #f2f2f7;
    --surface: rgba(255,255,255,0.92);
    --surface-solid: #ffffff;

    --text: #1c1c1e;
    --secondary: #8e8e93;

    --separator: rgba(60,60,67,0.16);

    --blue: #007aff;

    --radius: 18px;

}


* {

    box-sizing: border-box;

    margin: 0;
    padding: 0;

    -webkit-tap-highlight-color: transparent;

}


html,
body {

    width: 100%;
    min-height: 100%;

}


body {

    background: var(--background);

    color: var(--text);

    font-family:

        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "Helvetica Neue",
        Arial,
        sans-serif;

    -webkit-font-smoothing: antialiased;

    overflow-x: hidden;

}


button {

    font-family: inherit;

}


/* =========================================================
   APP CONTAINER
========================================================= */

.app {

    width: 100%;
    max-width: 430px;

    min-height: 100vh;

    margin: 0 auto;

    background: var(--surface-solid);

    position: relative;

}


/* =========================================================
   TOP BAR
========================================================= */

.top-bar {

    height: 64px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding:

        env(safe-area-inset-top, 0px)

        18px

        0

        18px;

    background: rgba(255,255,255,0.88);

    backdrop-filter: blur(24px);

    -webkit-backdrop-filter: blur(24px);

    border-bottom: 0.5px solid var(--separator);

    position: sticky;

    top: 0;

    z-index: 50;

}


.brand {

    font-size: 26px;

    font-weight: 700;

    letter-spacing: -1.4px;

}


.top-actions {

    display: flex;

    align-items: center;

    gap: 7px;

}


.top-button {

    width: 40px;
    height: 40px;

    display: flex;

    align-items: center;
    justify-content: center;

    border: none;

    background: transparent;

    color: var(--text);

    border-radius: 50%;

    transition:

        background 0.15s ease,

        transform 0.15s ease;

}


.top-button:active {

    background: rgba(0,0,0,0.07);

    transform: scale(0.90);

}


/* =========================================================
   STORIES
========================================================= */

.stories-wrapper {

    background: var(--surface-solid);

    border-bottom: 0.5px solid var(--separator);

}


.stories {

    display: flex;

    gap: 17px;

    overflow-x: auto;

    padding: 15px 17px 16px;

    scrollbar-width: none;

}


.stories::-webkit-scrollbar {

    display: none;

}


.story {

    min-width: 62px;

    text-align: center;

}


.story-ring {

    width: 60px;
    height: 60px;

    border-radius: 50%;

    padding: 2px;

    margin: 0 auto 6px;

    background:

        linear-gradient(

            135deg,

            #ff9f0a,
            #ff375f,
            #af52de,
            #5856d6

        );

}


.story-avatar {

    width: 100%;
    height: 100%;

    border-radius: 50%;

    object-fit: cover;

    border: 3px solid white;

}


.story-name {

    font-size: 11px;

    color: #3a3a3c;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;

}


/* =========================================================
   POST
========================================================= */

.post {

    background: white;

    border-bottom: 0.5px solid var(--separator);

    padding-bottom: 18px;

}


/* POST HEADER */

.post-header {

    height: 62px;

    padding: 0 17px;

    display: flex;

    align-items: center;

    justify-content: space-between;

}


.profile-info {

    display: flex;

    align-items: center;

    gap: 10px;

}


.profile-photo {

    width: 39px;
    height: 39px;

    border-radius: 50%;

    object-fit: cover;

}


.profile-text {

    display: flex;

    flex-direction: column;

    gap: 2px;

}


.username {

    font-size: 14px;

    font-weight: 600;

    letter-spacing: -0.1px;

}


.location {

    font-size: 11px;

    color: var(--secondary);

}


.more-button {

    width: 38px;
    height: 38px;

    border: none;

    background: transparent;

    color: var(--text);

    display: flex;

    align-items: center;

    justify-content: center;

}


/* =========================================================
   IMAGE
========================================================= */

.post-image {

    width: 100%;

    aspect-ratio: 1 / 1;

    object-fit: cover;

    display: block;

}


/* =========================================================
   POST ACTIONS
========================================================= */

.post-actions {

    height: 55px;

    display: flex;

    align-items: center;

    padding: 0 17px;

    gap: 19px;

}


.action-button {

    width: 28px;
    height: 28px;

    border: none;

    background: transparent;

    color: var(--text);

    display: flex;

    align-items: center;

    justify-content: center;

    transition:

        transform 0.15s ease,

        opacity 0.15s ease;

}


.action-button:active {

    transform: scale(0.82);

    opacity: 0.5;

}


.action-button.save {

    margin-left: auto;

}


.action-button.liked {

    color: #ff2d55;

}


/* =========================================================
   POST TEXT
========================================================= */

.post-details {

    padding: 0 17px;

}


.likes {

    font-size: 14px;

    font-weight: 600;

    margin-bottom: 5px;

}


.caption {

    font-size: 14px;

    line-height: 1.45;

    letter-spacing: -0.1px;

}


.caption strong {

    font-weight: 600;

}


.comments {

    margin-top: 7px;

    color: var(--secondary);

    font-size: 13px;

}


.timestamp {

    margin-top: 8px;

    color: #aeaeb2;

    font-size: 10px;

    letter-spacing: 0.1px;

}


/* =========================================================
   IOS TAB BAR
========================================================= */

.tab-bar {

    position: fixed;

    left: 50%;

    bottom: 0;

    transform: translateX(-50%);

    width: 100%;

    max-width: 430px;

    height: 82px;

    padding-bottom: env(safe-area-inset-bottom, 0px);

    background:

        rgba(250,250,252,0.88);

    backdrop-filter: blur(28px);

    -webkit-backdrop-filter: blur(28px);

    border-top: 0.5px solid var(--separator);

    display: flex;

    align-items: flex-start;

    justify-content: space-around;

    z-index: 100;

}


/* TAB */

.tab {

    width: 20%;

    height: 66px;

    border: none;

    background: transparent;

    color: #8e8e93;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: flex-start;

    padding-top: 10px;

    gap: 4px;

    transition:

        transform 0.15s ease,

        color 0.15s ease;

}


.tab:active {

    transform: scale(0.88);

}


.tab.active {

    color: #1c1c1e;

}


.tab svg {

    width: 25px;
    height: 25px;

}


.tab-label {

    font-size: 9px;

    font-weight: 500;

    letter-spacing: -0.1px;

}


.tab.active .tab-label {

    font-weight: 600;

}


/* CREATE */

.create-symbol {

    width: 25px;
    height: 25px;

    border: 1.7px solid currentColor;

    border-radius: 8px;

    display: flex;

    align-items: center;

    justify-content: center;

    position: relative;

}


.create-symbol::before {

    content: "";

    position: absolute;

    width: 11px;
    height: 1.6px;

    border-radius: 2px;

    background: currentColor;

}


.create-symbol::after {

    content: "";

    position: absolute;

    width: 1.6px;
    height: 11px;

    border-radius: 2px;

    background: currentColor;

}


/* =========================================================
   BOTTOM CONTENT SPACE
========================================================= */

.bottom-space {

    height: 95px;

}


/* =========================================================
   DARK MODE FOUNDATION
========================================================= */

@media (prefers-color-scheme: dark) {

    :root {

        --background: #000000;

        --surface-solid: #000000;

        --surface: rgba(28,28,30,0.92);

        --text: #f5f5f7;

        --secondary: #8e8e93;

        --separator: rgba(84,84,88,0.65);

    }

    .top-bar {

        background: rgba(28,28,30,0.88);

    }

    .stories-wrapper {

        background: #000;

    }

    .post {

        background: #000;

    }

    .story-avatar {

        border-color: #000;

    }

    .tab-bar {

        background: rgba(28,28,30,0.88);

    }

}


/* =========================================================
   REDUCED MOTION
========================================================= */

@media (prefers-reduced-motion: reduce) {

    * {

        scroll-behavior: auto !important;

        transition: none !important;

        animation: none !important;

    }

}

</style>

</head>


<body>


<div class="app">


<!-- =======================================================
     TOP NAVIGATION
======================================================= -->

<header class="top-bar">


    <div class="brand">

        Onstagram

    </div>


    <div class="top-actions">


        <!-- CREATE -->

        <button
            class="top-button"
            aria-label="Create"
        >

            <svg
                width="23"
                height="23"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linecap="round"
            >

                <path d="M12 5v14"/>

                <path d="M5 12h14"/>

            </svg>

        </button>


        <!-- DM -->

        <button
            class="top-button"
            aria-label="Messages"
            id="dmButton"
        >

            <svg
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.65"
                stroke-linecap="round"
                stroke-linejoin="round"
            >

                <path
                    d="M21 3 10.5 13.5"
                />

                <path
                    d="m21 3-6.8 18-3.7-7.5L3 9.8 21 3Z"
                />

            </svg>

        </button>

    </div>

</header>



<!-- =======================================================
     STORIES
======================================================= -->

<section class="stories-wrapper">

<div class="stories">


    <div class="story">

        <div class="story-ring">

            <img
                class="story-avatar"
                src="https://i.pravatar.cc/100?img=12"
            >

        </div>

        <div class="story-name">
            Your story
        </div>

    </div>


    <div class="story">

        <div class="story-ring">

            <img
                class="story-avatar"
                src="https://i.pravatar.cc/100?img=47"
            >

        </div>

        <div class="story-name">
            Rishabh
        </div>

    </div>


    <div class="story">

        <div class="story-ring">

            <img
                class="story-avatar"
                src="https://i.pravatar.cc/100?img=32"
            >

        </div>

        <div class="story-name">
            Ananya
        </div>

    </div>


    <div class="story">

        <div class="story-ring">

            <img
                class="story-avatar"
                src="https://i.pravatar.cc/100?img=13"
            >

        </div>

        <div class="story-name">
            Khan
        </div>

    </div>


    <div class="story">

        <div class="story-ring">

            <img
                class="story-avatar"
                src="https://i.pravatar.cc/100?img=5"
            >

        </div>

        <div class="story-name">
            Aisha
        </div>

    </div>


</div>

</section>



<!-- =======================================================
     POST
======================================================= -->

<article class="post">


    <!-- POST HEADER -->

    <div class="post-header">


        <div class="profile-info">


            <img
                class="profile-photo"
                src="https://i.pravatar.cc/100?img=11"
            >


            <div class="profile-text">

                <div class="username">
                    earth
                </div>

                <div class="location">
                    Lofoten, Norway
                </div>

            </div>


        </div>


        <button
            class="more-button"
            aria-label="More"
        >

            <svg
                width="22"
                height="22"
                viewBox="0 0 24 24"
                fill="currentColor"
            >

                <circle cx="5" cy="12" r="1.4"/>
                <circle cx="12" cy="12" r="1.4"/>
                <circle cx="19" cy="12" r="1.4"/>

            </svg>

        </button>


    </div>



    <!-- PHOTO -->

    <img
        class="post-image"
        src="https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=900&q=90"
        alt="Landscape"
    >



    <!-- ACTIONS -->

    <div class="post-actions">


        <!-- LIKE -->

        <button
            class="action-button like-button"
            aria-label="Like"
        >

            <svg
                class="like-icon"
                width="25"
                height="25"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linecap="round"
                stroke-linejoin="round"
            >

                <path
                    d="M20.8 8.7c0 5.5-8.8 10.3-8.8 10.3S3.2 14.2 3.2 8.7A4.7 4.7 0 0 1 12 6.4a4.7 4.7 0 0 1 8.8 2.3Z"
                />

            </svg>

        </button>



        <!-- COMMENT -->

        <button
            class="action-button"
            aria-label="Comment"
        >

            <svg
                width="25"
                height="25"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linecap="round"
                stroke-linejoin="round"
            >

                <path
                    d="M20 11.5a7.5 7.5 0 0 1-7.5 7.5c-1.2 0-2.4-.3-3.4-.8L5 20l1.8-3.4A7.5 7.5 0 1 1 20 11.5Z"
                />

            </svg>

        </button>



        <!-- SHARE -->

        <button
            class="action-button"
            aria-label="Share"
        >

            <svg
                width="25"
                height="25"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linecap="round"
                stroke-linejoin="round"
            >

                <path d="M21 3 10.5 13.5"/>

                <path
                    d="m21 3-6.7 18-3.8-7.3L3 9.7 21 3Z"
                />

            </svg>

        </button>



        <!-- SAVE -->

        <button
            class="action-button save"
            aria-label="Save"
        >

            <svg
                width="25"
                height="25"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linecap="round"
                stroke-linejoin="round"
            >

                <path
                    d="M6 4.5A2.5 2.5 0 0 1 8.5 2h7A2.5 2.5 0 0 1 18 4.5V21l-6-3-6 3V4.5Z"
                />

            </svg>

        </button>


    </div>



    <!-- DETAILS -->

    <div class="post-details">


        <div class="likes">
            12,421 likes
        </div>


        <div class="caption">

            <strong>earth</strong>

            Some places just feel unreal.

        </div>


        <div class="comments">
            View all 112 comments
        </div>


        <div class="timestamp">
            2 HOURS AGO
        </div>


    </div>


</article>



<div class="bottom-space"></div>


</div>



<!-- =======================================================
     iOS STYLE TAB BAR
======================================================= -->

<nav class="tab-bar">


    <!-- HOME -->

    <button
        class="tab active"
        data-page="home"
    >

        <div class="nav-icon">

            <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.65"
                stroke-linecap="round"
                stroke-linejoin="round"
            >

                <path d="m3 10 9-7 9 7"/>

                <path d="M5 9v11h14V9"/>

                <path d="M9 20v-6h6v6"/>

            </svg>

        </div>


        <span class="tab-label">
            Home
        </span>

    </button>



    <!-- SEARCH -->

    <button
        class="tab"
        data-page="search"
    >

        <div class="nav-icon">

            <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.65"
                stroke-linecap="round"
            >

                <circle
                    cx="10.7"
                    cy="10.7"
                    r="6.7"
                />

                <path d="m16 16 5 5"/>

            </svg>

        </div>


        <span class="tab-label">
            Search
        </span>

    </button>



    <!-- CREATE -->

    <button
        class="tab"
        data-page="create"
    >

        <div class="nav-icon">

            <div class="create-symbol"></div>

        </div>


        <span class="tab-label">
            Create
        </span>

    </button>



    <!-- REELS -->

    <button
        class="tab"
        data-page="reels"
    >

        <div class="nav-icon">

            <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.65"
                stroke-linecap="round"
                stroke-linejoin="round"
            >

                <rect
                    x="3"
                    y="3"
                    width="18"
                    height="18"
                    rx="5"
                />

                <path d="M3 8h18"/>

                <path d="m9 3 3 5"/>

                <path d="m15 3 3 5"/>

                <path
                    d="m10 12 5 3-5 3v-6Z"
                    fill="currentColor"
                    stroke="none"
                />

            </svg>

        </div>


        <span class="tab-label">
            Reels
        </span>

    </button>



    <!-- PROFILE -->

    <button
        class="tab"
        data-page="profile"
    >

        <div class="nav-icon">

            <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.65"
                stroke-linecap="round"
                stroke-linejoin="round"
            >

                <circle
                    cx="12"
                    cy="8"
                    r="3.5"
                />

                <path
                    d="M5 21c.8-4 3.2-6 7-6s6.2 2 7 6"
                />

            </svg>

        </div>


        <span class="tab-label">
            Profile
        </span>

    </button>


</nav>



<script>

/* =========================================================
   LIKE BUTTON
========================================================= */

const likeButton =
    document.querySelector(".like-button");


likeButton.addEventListener("click", function () {

    this.classList.toggle("liked");

    const icon =
        this.querySelector(".like-icon");


    if (this.classList.contains("liked")) {

        icon.setAttribute(
            "fill",
            "currentColor"
        );

    } else {

        icon.setAttribute(
            "fill",
            "none"
        );

    }

});



/* =========================================================
   TAB BAR
========================================================= */

const tabs =
    document.querySelectorAll(".tab");


tabs.forEach(tab => {

    tab.addEventListener("click", function () {

        tabs.forEach(item => {

            item.classList.remove("active");

        });


        this.classList.add("active");

    });

});



/* =========================================================
   DM BUTTON
========================================================= */

document
    .getElementById("dmButton")
    .addEventListener("click", function () {

        /*
           Later this button will open
           the Onstagram DM screen.
        */

        console.log("Messages opened");

    });


</script>


</body>

</html>
